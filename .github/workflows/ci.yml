name: CI Workflow - Docker

on:
  push:
    branches:
      - main

# Lets the job push the updated index.html back to main
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Step 1: Checks out the repository code to the runner's environment
        # so that subsequent steps can access the project files.
        uses: actions/checkout@v4

      - name: Build Docker image
        # Step 2: Builds a Docker image named `task-manager` with the latest tag
        # using the Dockerfile in the current directory.
        run: docker build -t task-manager:latest .

      - name: Run Docker container
        # Step 3: Runs the Docker container built in the previous step.
        # Passes the GitHub username (via the environment variable GITHUB_USER)
        # to the container. The `--rm` flag removes the container after execution.
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" task-manager:latest
